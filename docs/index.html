<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Team Generator</title>
    <base href="/random-scramble/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RandomScrambleWeb.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Select all text when any player input gains focus
        document.addEventListener('focus', function (e) {
            if (e.target.matches('.name-input, .score-input, .bot-id-input, .team-size-input')) {
                setTimeout(function () { e.target.select(); }, 0);
            }
        }, true);

        // Tab from score column jumps to the next row's name input (skips remove button)
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Tab' && !e.shiftKey && e.target.classList.contains('score-input')) {
                var row = e.target.closest('.player-row');
                var nextRow = row && row.nextElementSibling;
                if (nextRow && nextRow.classList.contains('player-row')) {
                    e.preventDefault();
                    var nameInput = nextRow.querySelector('.name-input');
                    if (nameInput) nameInput.focus();
                }
            }
        }, true);
    </script>

    <script src="js/speech.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
